<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noimageindex">
    <title>浜北商工会 青年部名鑑 -The Digital-</title>
    <style>
        :root {
            --primary-color: #0d1b2a;
            --second-color: #1b263b;
            --accent-color: #e0a96d;
            --text-color: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            font-family: 'Noto Serif JP', serif;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--second-color) 100%);
            color: var(--text-color);
        }
        .lock-card {
            width: 100%;
            max-width: 360px;
            text-align: center;
        }
        .lock-card h1 {
            font-size: 1.4rem;
            color: #fff;
            margin-bottom: 6px;
        }
        .lock-card .sub {
            color: var(--accent-color);
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            margin-bottom: 28px;
        }
        .lock-card p { font-size: 0.9rem; margin-bottom: 12px; }
        input[type="password"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid var(--accent-color);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.95);
            color: var(--primary-color);
        }
        label.remember {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin: 12px 0 16px;
            font-size: 0.85rem;
        }
        button {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            border-radius: 6px;
            background: var(--accent-color);
            color: var(--primary-color);
            cursor: pointer;
        }
        button:disabled { opacity: 0.6; cursor: wait; }
        .error { color: #ff8a80; min-height: 1.4em; margin-top: 12px; font-size: 0.9rem; }
        .note { margin-top: 24px; font-size: 0.75rem; opacity: 0.7; }
    </style>
</head>
<body>
    <form class="lock-card" id="lock-form">
        <h1>青年部名鑑</h1>
        <div class="sub">- The Digital -</div>
        <p>合言葉を入力してください</p>
        <input type="password" id="lock-pass" autocomplete="current-password" required>
        <label class="remember"><input type="checkbox" id="lock-remember" checked> この端末で記憶する</label>
        <button type="submit" id="lock-button">開く</button>
        <div class="error" id="lock-error" role="alert"></div>
        <div class="note">合言葉は青年部の全体LINEでご確認ください</div>
    </form>

    <script id="payload" type="application/json">{{ payload }}</script>
    <script>
        const STORAGE_KEY = 'seinenbu-meikan-pass';
        const payload = JSON.parse(document.getElementById('payload').textContent);
        const fromBase64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

        async function decryptPage(pass) {
            const baseKey = await crypto.subtle.importKey(
                'raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
            const key = await crypto.subtle.deriveKey(
                { name: 'PBKDF2', salt: fromBase64(payload.salt), iterations: payload.iterations, hash: 'SHA-256' },
                baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
            const plain = await crypto.subtle.decrypt(
                { name: 'AES-GCM', iv: fromBase64(payload.iv) }, key, fromBase64(payload.data));
            return new TextDecoder().decode(plain);
        }

        function showPage(html) {
            document.open();
            document.write(html);
            document.close();
        }

        function storage(action, value) {
            try {
                if (action === 'get') return localStorage.getItem(STORAGE_KEY);
                if (action === 'set') localStorage.setItem(STORAGE_KEY, value);
                if (action === 'remove') localStorage.removeItem(STORAGE_KEY);
            } catch (e) { /* 記憶できない環境では毎回入力 */ }
            return null;
        }

        const form = document.getElementById('lock-form');
        const button = document.getElementById('lock-button');
        const error = document.getElementById('lock-error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const pass = document.getElementById('lock-pass').value;
            button.disabled = true;
            button.textContent = '確認中…';
            error.textContent = '';
            try {
                const html = await decryptPage(pass);
                if (document.getElementById('lock-remember').checked) storage('set', pass);
                showPage(html);
            } catch (err) {
                error.textContent = '合言葉が違います';
                button.disabled = false;
                button.textContent = '開く';
            }
        });

        // 記憶した合言葉があれば自動で開く（合言葉が変わっていたら入力画面に戻る）
        const saved = storage('get');
        if (saved) {
            button.disabled = true;
            button.textContent = '読み込み中…';
            decryptPage(saved).then(showPage).catch(() => {
                storage('remove');
                button.disabled = false;
                button.textContent = '開く';
            });
        }
    </script>
</body>
</html>
